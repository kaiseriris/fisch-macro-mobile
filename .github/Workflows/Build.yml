name: Build Fisch Macro APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack the project
        run: |
          mkdir proj
          unzip -q FischMacro.zip -d proj
          ls proj

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build the APK
        working-directory: proj
        run: gradle --no-daemon :app:assembleDebug

      - name: Name the APK
        run: cp proj/app/build/outputs/apk/debug/app-debug.apk FischMacro.apk

      - name: Keep a copy as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: FischMacro-apk
          path: FischMacro.apk

      - name: Publish a release with the APK (easiest to download on a phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Fisch Macro build ${{ github.run_number }}
          files: FischMacro.apk
