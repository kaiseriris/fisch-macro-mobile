
name: Build Fisch Macro APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check project ZIP
        run: |
          if [ ! -f FischMacro.zip ]; then
            echo "ERROR: FischMacro.zip was not found."
            exit 1
          fi

      - name: Unpack project
        run: |
          mkdir -p proj
          unzip -q FischMacro.zip -d proj

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: proj
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK
        run: |
          APK="proj/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi
          cp "$APK" FischMacro.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FischMacro-apk
          path: FischMacro.apk

      - name: Publish GitHub release
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Fisch Macro build ${{ github.run_number }}
          files: FischMacro.apk
